<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>好看的渐变效果</title>
  <style>
    /* 更多内容可关注CSDN博主-‘拄杖盲学轻声码’ 百家号-demo江湖，知乎-江湖人称黄大大*/
    .alljb {
      width: 1320px;
      height: 700px;
      margin: 40px auto;
      border: 1px solid #eee;
    }

    h2 {
      color: #466886;
      margin: 10px 10px;
      font-size: 15px;
      float: left;
      font-family: "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
      padding-left: 10px;
      border-left: 2px solid #3e9cd6;
    }

    .xxbox {
      width: 1300px;
      height: 300px;
      float: left;
    }

    .boxpart {
      width: 160px;
      height: 120px;
      border: 1px solid #efefef;
      margin: 10px;

      float: left;
    }

    .bpart {
      width: 145px;
      height: 80px;
      margin: 5px auto;
    }

    .xx_jb1 {
      background: linear-gradient(#e66465, #9198e5);
    }

    .xx_jb2 {
      background: linear-gradient(to right, #9fe1fa, #f4edc9);
    }

    .xx_jb3 {
      background: linear-gradient(to top right,
          rgb(238, 163, 175),
          rgb(149, 214, 240));
    }

    .xx_jb4 {
      background: linear-gradient(111.4deg,
          rgb(238, 113, 113) 1%,
          rgb(246, 215, 148) 58%);
    }

    .xx_jb8 {
      background: linear-gradient(102.7deg,
          rgb(253, 218, 255) 8.2%,
          rgb(223, 173, 252) 19.6%,
          rgb(173, 205, 252) 36.8%,
          rgb(173, 252, 244) 73.2%,
          rgb(202, 248, 208) 90.9%);
    }

    .xx_jb10 {
      background: linear-gradient(58.2deg,
          rgba(40, 91, 212, 0.73) -3%,
          rgba(171, 53, 163, 0.45) 49.3%,
          rgba(255, 204, 112, 0.37) 97.7%);
    }

    .xx_jb13 {
      background-image: linear-gradient(107.7deg,
          rgb(101, 168, 143) -30.7%,
          rgb(144, 220, 193) 7.2%,
          rgb(225, 203, 150) 31.3%,
          rgb(251, 166, 150) 82.6%,
          rgb(250, 54, 65) 128.5%);
    }

    .xx_jb14 {
      background-image: linear-gradient(181.2deg,
          rgb(181, 239, 249) 10.5%,
          rgb(254, 254, 254) 86.8%);
    }

    .xx_jb15 {
      background-image: linear-gradient(111.4deg,
          rgb(209, 231, 235) 7.4%,
          rgb(238, 219, 199) 51.4%,
          rgb(255, 159, 122) 82.6%,
          rgb(255, 109, 58) 100.2%);
    }

    .xx_jb16 {
      background-image: linear-gradient(109.6deg,
          rgb(101, 58, 150) 29.9%,
          rgb(168, 141, 194) 99.9%);
    }

    .xx_jb18 {
      background-image: linear-gradient(106.5deg,
          rgba(255, 215, 185, 0.91) 23%,
          rgba(223, 159, 247, 0.8) 93%);
    }

    .xx_jb19 {
      background-image: linear-gradient(109.6deg,
          rgb(0, 51, 102) 11.2%,
          rgb(187, 187, 187) 91.1%);
    }

    .xx_jb20 {
      background-image: linear-gradient(103.3deg,
          rgb(252, 225, 208) 30%,
          rgb(255, 173, 214) 55.7%,
          rgb(162, 186, 245) 81.8%);
    }

    .xx_jb21 {
      background-image: linear-gradient(110.6deg,
          rgb(179, 157, 219) 7%,
          rgb(150, 159, 222) 47.7%,
          rgb(24, 255, 255) 100.6%);
    }

    .xx_jb5 {
      background: radial-gradient(178px at 1.8% 4%,
          rgb(162, 208, 254) 0.1%,
          rgba(193, 94, 245, 0.73) 100.2%);
    }

    .xx_jb9 {
      background: radial-gradient(128px at 31.7% 40.2%,
          rgb(225, 200, 239) 21.4%,
          rgb(163, 225, 233) 57.1%);
    }

    .xx_jb11 {
      background: radial-gradient(169px at -2.9% 12.9%,
          rgb(247, 234, 163) 0%,
          rgba(236, 180, 238, 0.56) 46.4%,
          rgb(163, 203, 247) 100.7%);
    }

    .xx_jb6 {
      background: radial-gradient(circle at 10% 20%,
          rgb(239, 246, 249) 0%,
          rgb(206, 239, 253) 90%);
    }

    .xx_jb7 {
      background: radial-gradient(circle at 32.2% 83.5%,
          rgb(239, 167, 167) 0%,
          rgb(215, 123, 191) 90%);
    }

    .xx_jb12 {
      background: radial-gradient(circle at 7.2% 13.6%,
          rgb(37, 249, 245) 0%,
          rgb(8, 70, 218) 90%);
    }

    .xx_jb17 {
      background-image: radial-gradient(circle at 10.6% 23.3%,
          rgb(186, 162, 252) 0%,
          rgb(176, 248, 242) 72.4%);
    }

    .xx_jb22 {
      background-image: radial-gradient(circle at 10% 20%,
          rgb(249, 57, 170) 9.8%,
          rgb(134, 176, 255) 94.9%);
    }

    .xx_jb23 {
      background-image: radial-gradient(circle at 48.7% 44.3%,
          rgb(30, 144, 231) 0%,
          rgb(56, 113, 209) 22.9%,
          rgb(38, 76, 140) 76.7%,
          rgb(31, 63, 116) 100.2%);
    }

    .xx_jb24 {
      background-image: radial-gradient(circle at 10% 20%,
          rgb(222, 168, 248) 0%,
          rgb(168, 222, 248) 21.8%,
          rgb(189, 250, 205) 35.6%,
          rgb(243, 250, 189) 52.9%,
          rgb(250, 227, 189) 66.8%,
          rgb(248, 172, 172) 90%,
          rgb(254, 211, 252) 99.7%);
    }

    .xx_txt {
      width: 100%;
      height: 35px;
      line-height: 35px;
      float: left;
      font-size: 14px;
      color: #ff7f27;
      text-align: center;
    }

    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      background-color: #86b0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 36px;
    }

    .col {
      color: #efefef;
    }

    a {
      color: #efefef;
    }
  </style>
</head>

<body>
  <div class="alljb">
    <h2>线性渐变</h2>
    <div class="xxbox">
      <div class="boxpart">
        <div class="bpart xx_jb1"></div>
        <div class="xx_txt">X1.从上往下</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb2"></div>
        <div class="xx_txt">X2.从左到右</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb3"></div>
        <div class="xx_txt">X3.从左下到右上</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb4"></div>
        <div class="xx_txt">X4.带度数的渐变1</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb8"></div>
        <div class="xx_txt">X5.带度数的渐变2</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb10"></div>
        <div class="xx_txt">X6.带度数的渐变3</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb14"></div>
        <div class="xx_txt">X7.带度数的渐变4</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb13"></div>
        <div class="xx_txt">X8.带度数的渐变5</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb15"></div>
        <div class="xx_txt">X9.带度数的渐变6</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb16"></div>
        <div class="xx_txt">X10.带度数的渐变7</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb18"></div>
        <div class="xx_txt">X11.带度数的渐变8</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb19"></div>
        <div class="xx_txt">X12.带度数的渐变9</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb20"></div>
        <div class="xx_txt">X13.带度数的渐变10</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb21"></div>
        <div class="xx_txt">X14.带度数的渐变11</div>
      </div>
    </div>
    <h2 style="width: 100%; float: left">径向渐变</h2>

    <div class="xxbox" style="width: 914px; float: left">
      <div class="boxpart">
        <div class="bpart xx_jb5"></div>
        <div class="xx_txt">J1.像素位置渐变1</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb9"></div>
        <div class="xx_txt">J2.像素位置渐变2</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb11"></div>
        <div class="xx_txt">J3.像素位置渐变3</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb6"></div>
        <div class="xx_txt">J4.圆形渐变1</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb7"></div>
        <div class="xx_txt">J5.圆形渐变2</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb12"></div>
        <div class="xx_txt">J6.圆形渐变3</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb17"></div>
        <div class="xx_txt">J7.圆形渐变4</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb22"></div>
        <div class="xx_txt">J8.圆形渐变5</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb23"></div>
        <div class="xx_txt">J9.圆形渐变6</div>
      </div>
      <div class="boxpart">
        <div class="bpart xx_jb24"></div>
        <div class="xx_txt">J10.圆形渐变7</div>
      </div>
    </div>
  </div>
